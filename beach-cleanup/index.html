<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바닷가 쓰레기 줍기</title>
<style>
:root{
  --sky1:#bfe8ff; --sky2:#e9f8ff;
  --sea1:#2aa7d8; --sea2:#1b86c0;
  --sand1:#f6dfa8; --sand2:#ecc97f;
  --ink:#24323f; --sub:#5b6b7a;
  --card:#ffffff; --line:#e3e8ee;
  --accent:#ff7b54; --good:#2fb36d; --warn:#f2a20c;
  --plastic:#3b8beb; --can:#7f8a9c; --paper:#c4884a;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--sky2)}
button{font-family:inherit;cursor:pointer}
svg{display:block;width:100%;height:100%;pointer-events:none}
.hidden{display:none!important}

/* ---------- 첫 화면 ---------- */
#home{position:fixed;inset:0;overflow:auto;background:linear-gradient(var(--sky1),var(--sky2) 45%,var(--sand1) 45%,var(--sand2));display:flex;flex-direction:column;align-items:center;padding:28px 16px 40px}
#home h1{margin:6px 0 4px;font-size:clamp(28px,4.4vw,46px);color:#0f5d8c;text-shadow:0 3px 0 #fff}
#home .lead{margin:0 0 22px;font-size:clamp(16px,2vw,21px);color:#24506d;text-align:center}
.stages{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:14px;width:min(1100px,100%)}
.stage{background:var(--card);border:4px solid #fff;border-radius:22px;padding:14px 10px 12px;box-shadow:0 6px 0 rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.stage:hover{transform:translateY(-4px);border-color:#ffd36b}
.stage .num{font-size:15px;font-weight:700;color:#fff;background:#0f8ac9;border-radius:99px;padding:3px 12px}
.stage .ani{width:110px;height:78px}
.stage .nm{font-size:18px;font-weight:700}
.stage .mv{font-size:14px;color:var(--sub);text-align:center;line-height:1.35;min-height:38px}
.stage .star{font-size:14px;color:var(--good);font-weight:700;height:18px}
.homeopts{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.toggle{background:#fff;border:2px solid var(--line);border-radius:99px;padding:10px 18px;font-size:16px;color:var(--sub)}
.toggle.on{border-color:#0f8ac9;color:#0f8ac9;font-weight:700}

/* ---------- 게임 화면 ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
#top{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:3px solid var(--line);z-index:5}
#top .title{font-size:20px;font-weight:800;white-space:nowrap}
.btn{border:none;border-radius:14px;padding:10px 16px;font-size:16px;font-weight:700;background:#eef3f8;color:var(--ink);min-height:44px}
.btn.main{background:var(--accent);color:#fff;font-size:20px;padding:14px 30px;box-shadow:0 5px 0 #d85a35}
.btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 #d85a35}
.btn.skip{background:#fff4d6;color:#8a5a00}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:120px}
.bar{flex:1;height:22px;background:#e8eef4;border-radius:99px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#5fd3ff,#2fb36d);border-radius:99px;transition:width .4s}
.prog .goal{width:58px;height:42px;flex:none;filter:grayscale(1) opacity(.45);transition:filter .4s}
.prog .goal.near{filter:none}
.timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;background:#e8f6ff;color:#0f5d8c;padding:6px 14px;border-radius:12px;white-space:nowrap}
.bigtime{font-size:46px;font-weight:900;color:#0f5d8c;font-variant-numeric:tabular-nums;margin:4px 0}
@keyframes pop2{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
.corner{position:absolute;top:12px;right:16px;display:flex;gap:6px;z-index:10}
.mini{font-size:13px;padding:6px 12px;min-height:32px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--sub)}
.mini.on{border-color:#0f8ac9;color:#0f8ac9;font-weight:700}
.mini.tch{background:#fff4d6;border-color:#ffd36b;color:#8a5a00;font-weight:700;animation:pop2 .4s ease-out}
#home{position:fixed}
.count{font-size:17px;font-weight:700;white-space:nowrap;background:#fff2ec;color:#c4502a;padding:8px 12px;border-radius:12px}

#beachWrap{flex:1;position:relative;min-height:0}
#beach{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
#beach::-webkit-scrollbar{height:12px}
#beach::-webkit-scrollbar-thumb{background:rgba(0,0,0,.25);border-radius:9px}
#world{position:relative;height:100%;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 26%,transparent 26%)}
.sea{position:absolute;left:0;right:0;top:26%;height:24%;background:linear-gradient(var(--sea2),var(--sea1));overflow:hidden}
.sea .wave{position:absolute;left:0;right:0;bottom:-2px;height:28px;background:radial-gradient(circle at 20px -6px,transparent 22px,var(--sand1) 23px) repeat-x;background-size:40px 28px;animation:wave 3s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(5px)}}
#dirt{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(95,80,50,.0) 0 26px,rgba(95,80,50,.45) 26px 30px),#9c9470;mix-blend-mode:multiply;transition:opacity .6s}
.sand{position:absolute;left:0;right:0;top:48%;bottom:0;background:radial-gradient(circle at 10% 30%,rgba(255,255,255,.35) 2px,transparent 3px) 0 0/46px 46px,radial-gradient(circle at 60% 70%,rgba(160,110,40,.18) 2px,transparent 3px) 0 0/38px 38px,linear-gradient(var(--sand1),var(--sand2))}
.deco{position:absolute;pointer-events:none;opacity:.9}
.sun{position:absolute;top:4%;width:70px;height:70px;border-radius:50%;background:#ffd84d;box-shadow:0 0 0 12px rgba(255,216,77,.3)}
.cloud{position:absolute;width:120px;height:36px;background:#fff;border-radius:40px;opacity:.9}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:50px;height:50px;left:18px;top:-24px}.cloud:after{width:38px;height:38px;left:60px;top:-16px}

.it{position:absolute;transform:translate(-50%,-50%);cursor:pointer;touch-action:none}
.it .art{width:100%;height:100%;transition:transform .15s}
.it.light:hover .art,.it.float:hover .art{transform:scale(1.12)}
.it.float{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{margin-top:-10px;rotate:8deg}}
.it.heavy .art{animation:none}
.it.heavy.holding .art{animation:wig .12s linear infinite}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.tag{position:absolute;right:-6px;top:-8px;background:#ff5d5d;color:#fff;font-weight:800;font-size:15px;border-radius:12px;padding:3px 9px;border:3px solid #fff;pointer-events:none}
.ring{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--rc,#ff7b54) calc(var(--p,0)*360deg),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));opacity:0;transition:opacity .15s}
.it.holding .ring,.it.hovering .ring{opacity:1}
.it.mound{--rc:#2fb36d}
.it.mound .spark{position:absolute;width:22px;height:22px;top:6%;right:16%;pointer-events:none;animation:spark 1.6s ease-in-out infinite}
@keyframes spark{50%{transform:scale(.4) rotate(45deg);opacity:.3}}
.it.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3)}70%{transform:translate(-50%,-50%) scale(1.2)}}
.it.nope{animation:nope .35s}
@keyframes nope{25%{margin-left:-8px}75%{margin-left:8px}}

.edge{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(255,255,255,.92);border-radius:18px;padding:10px 12px;font-weight:800;font-size:18px;color:#c4502a;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;animation:nudge 1.2s ease-in-out infinite}
#edgeL{left:10px}#edgeR{right:10px}
@keyframes nudge{50%{margin-left:6px}}
#edgeL{animation-direction:reverse}
.edge .mini{width:30px;height:30px}

#wheelHint{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:4;background:rgba(15,93,140,.9);color:#fff;border-radius:22px;padding:14px 22px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:12px;pointer-events:none}
#wheelHint .ms{width:42px;height:58px}

#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;background:#fff;border:3px solid var(--warn);color:#7a4b00;font-size:20px;font-weight:800;border-radius:18px;padding:10px 20px;box-shadow:0 6px 16px rgba(0,0,0,.15);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

#bottom{height:150px;flex:none;display:flex;gap:16px;align-items:stretch;padding:10px 14px;background:#fff;border-top:3px solid var(--line);z-index:5}
#bagBox{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff8e8;border:3px dashed #e8c77c;border-radius:20px;padding:6px 12px}
#bagBox.full{border-color:#ff5d5d;background:#fff0f0}
#bagBox.shake{animation:nope .35s}
#bagBox .lb{font-size:16px;font-weight:800;color:#8a6420}
#bag{flex:1;display:flex;align-items:center;gap:10px}
.slot{width:82px;height:82px;border-radius:18px;border:3px dotted #e8c77c;flex:none;position:relative}
.slot.has{border:3px solid #f0d08a;background:#fff;cursor:grab;touch-action:none}
.slot.has:hover{background:#fff3cf}
.slot.lift{opacity:.25}
.slot .art{position:absolute;inset:8px}
#bins{display:flex;gap:12px;flex:none}
.bin{width:122px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px 4px 8px;position:relative;border:4px solid transparent;transition:transform .15s}
.bin .bsvg{width:84px;height:84px}
.bin .bl{font-size:19px;font-weight:800;color:#fff;border-radius:10px;padding:2px 12px;margin-top:2px}
.bin.over{transform:scale(1.08);border-color:#ffd36b;background:#fffbe6}
.bin.hint{animation:glow .7s ease-in-out infinite}
@keyframes glow{50%{border-color:#2fb36d;background:#eafff2}}
.bin.eat{animation:eat .45s}
@keyframes eat{40%{transform:scale(1.15) rotate(-3deg)}}
.bin.no{animation:nope .35s}

#ghost{position:fixed;width:86px;height:86px;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 8px 8px rgba(0,0,0,.25))}
.fly{position:fixed;z-index:40;pointer-events:none;transition:all .55s cubic-bezier(.5,-.2,.6,1)}

/* ---------- 안내·완료 카드 ---------- */
.ov{position:fixed;inset:0;z-index:60;background:rgba(10,40,60,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:28px;padding:26px 30px;max-width:640px;width:100%;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.25);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card h2{margin:0 0 6px;font-size:30px}
.card .sub{margin:0 0 16px;font-size:19px;color:var(--sub)}
.moves{display:flex;flex-direction:column;gap:10px;margin:0 0 20px;text-align:left}
.mvrow{display:flex;align-items:center;gap:14px;background:#f4f8fb;border-radius:16px;padding:8px 14px;font-size:20px;font-weight:700}
.mvrow.new{background:#fff4d6;outline:3px solid #ffd36b}
.mvrow .ms{width:38px;height:52px;flex:none}
.mvrow .nw{margin-left:auto;font-size:14px;background:#ff7b54;color:#fff;border-radius:99px;padding:2px 10px}
.bigani{width:240px;height:170px;margin:0 auto}
.friends{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 16px}
.friends div{width:104px;height:74px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.swimmer{position:absolute;width:200px;height:140px;z-index:2;pointer-events:none;animation:swim 2.2s ease-out forwards}
@keyframes swim{from{transform:translateX(120vw)}to{transform:translateX(0)}}

@media (max-width:900px){
  .stages{grid-template-columns:repeat(2,1fr)}
  #bottom{height:auto;flex-wrap:wrap}
  .slot{width:62px;height:62px}
  .bin{width:96px}.bin .bsvg{width:64px;height:64px}
  #top .title{font-size:16px}
  .count{font-size:14px}
}
</style>
</head>
<body>

<!-- 첫 화면 -->
<div id="home">
  <h1 id="homeTitle">바닷가 쓰레기 줍기 탐험</h1>
  <p class="lead">해변을 깨끗하게 치우면 바다 친구들이 돌아와요!</p>
  <div class="stages" id="stageList"></div>
  <div class="corner">
    <button class="mini tch hidden" id="tchBtn" title="누르면 강사 모드가 꺼져요">강사 모드 ✕</button>
    <button class="mini on" id="sndBtn">소리 켜짐</button>
  </div>
</div>

<!-- 게임 화면 -->
<div id="game" class="hidden">
  <div id="top">
    <button class="btn" id="homeBtn">처음으로</button>
    <div class="title" id="lvTitle"></div>
    <div class="prog"><div class="bar"><i id="barFill"></i></div><div class="goal" id="goalAni"></div></div>
    <div class="timer" id="timer">⏱ 00:00</div><div class="count" id="countTxt"></div>
    <button class="btn skip hidden" id="skipBtn">다음 단계 ▶</button>
  </div>
  <div id="beachWrap">
    <div id="beach"><div id="world"></div></div>
    <div class="edge hidden" id="edgeL">◀ <span></span></div>
    <div class="edge hidden" id="edgeR"><span></span> ▶</div>
    <div id="wheelHint" class="hidden"><div class="ms" id="wheelMs"></div>휠을 굴려서 해변을 둘러봐요</div>
    <div id="toast"></div>
  </div>
  <div id="bottom">
    <div id="bagBox"><div class="lb">내 가방 <span id="bagCnt"></span> — 끌어다 알맞은 통에 넣어요</div><div id="bag"></div></div>
    <div id="bins"></div>
  </div>
</div>

<div id="ov" class="ov hidden"><div class="card" id="ovCard"></div></div>

<script>
/* ===================== 그림 ===================== */
const ART = {
  bottle:'<svg viewBox="0 0 100 100"><g transform="rotate(-25 50 50)"><rect x="41" y="6" width="18" height="10" rx="2" fill="#2f6fd6"/><path d="M39 16h22v8c9 4 11 10 11 18v42c0 6-4 10-10 10H38c-6 0-10-4-10-10V42c0-8 2-14 11-18z" fill="#cfeaff" stroke="#5aa9e6" stroke-width="3"/><rect x="29" y="50" width="42" height="15" fill="#ff8a65"/><path d="M36 30v50" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/></g></svg>',
  pcup:'<svg viewBox="0 0 100 100"><g transform="rotate(15 50 50)"><path d="M58 4l-6 26" stroke="#ff5d8f" stroke-width="6" stroke-linecap="round"/><path d="M24 28h52l-7 62H31z" fill="#e6f6ff" stroke="#6bb7e8" stroke-width="3"/><ellipse cx="50" cy="28" rx="27" ry="6" fill="#bfe3ff" stroke="#6bb7e8" stroke-width="3"/><path d="M28 50h44" stroke="#9fd2f3" stroke-width="3"/></g></svg>',
  yogurt:'<svg viewBox="0 0 100 100"><g transform="rotate(-12 50 50)"><rect x="34" y="10" width="32" height="8" rx="3" fill="#e84a5f"/><path d="M36 18h28c2 8-6 14-6 22 0 10 10 14 10 30 0 14-6 22-18 22s-18-8-18-22c0-16 10-20 10-30 0-8-8-14-6-22z" fill="#fff5f0" stroke="#e8a090" stroke-width="3"/><rect x="34" y="56" width="32" height="12" rx="2" fill="#ffb3a7"/></g></svg>',
  can:'<svg viewBox="0 0 100 100"><g transform="rotate(70 50 50)"><rect x="28" y="16" width="44" height="68" rx="8" fill="#e8413c" stroke="#a72824" stroke-width="3"/><ellipse cx="50" cy="17" rx="22" ry="6" fill="#d7dbe0" stroke="#8d949c" stroke-width="3"/><path d="M28 44h44M28 58h44" stroke="#fff" stroke-width="5"/><path d="M36 26v50" stroke="#fff" stroke-width="3" opacity=".5"/></g></svg>',
  tuna:'<svg viewBox="0 0 100 100"><rect x="16" y="36" width="68" height="36" rx="6" fill="#f2c94c" stroke="#b08a1c" stroke-width="3"/><ellipse cx="50" cy="36" rx="34" ry="10" fill="#e0e4e8" stroke="#8d949c" stroke-width="3"/><ellipse cx="50" cy="36" rx="24" ry="6" fill="none" stroke="#a7aeb5" stroke-width="2"/><path d="M30 56c6-6 14-6 20 0s14 6 20 0" stroke="#2f6fd6" stroke-width="4" fill="none"/></svg>',
  box:'<svg viewBox="0 0 100 100"><g transform="rotate(-8 50 50)"><path d="M16 38l34-12 34 12v40L50 92 16 78z" fill="#d8a46a" stroke="#97622d" stroke-width="3"/><path d="M16 38l34 12 34-12M50 50v42" stroke="#97622d" stroke-width="3" fill="none"/><path d="M16 38l-8-14 34-10 8 12zM84 38l8-14-34-10-8 12z" fill="#e6b980" stroke="#97622d" stroke-width="3"/></g></svg>',
  news:'<svg viewBox="0 0 100 100"><g transform="rotate(10 50 50)"><path d="M14 24h66l6 6v48H14z" fill="#f1f1ee" stroke="#9aa0a6" stroke-width="3"/><rect x="22" y="32" width="24" height="18" fill="#c9ced3"/><path d="M52 34h26M52 42h26M52 50h20M22 58h56M22 66h56M22 74h40" stroke="#9aa0a6" stroke-width="3"/></g></svg>',
  pbag:'<svg viewBox="0 0 100 100"><g transform="rotate(-6 50 50)"><path d="M38 30c0-14 24-14 24 0" stroke="#7a4b20" stroke-width="4" fill="none"/><path d="M22 30h56l6 62H16z" fill="#c98e55" stroke="#7a4b20" stroke-width="3"/><path d="M22 30l-6 62M78 30l6 62" stroke="#a8713c" stroke-width="2"/><circle cx="50" cy="62" r="10" fill="none" stroke="#f7e3c4" stroke-width="3"/></g></svg>',
  jerry:'<svg viewBox="0 0 100 100"><path d="M24 22h30l6-10h14v16l6 6v54c0 4-3 6-6 6H22c-3 0-6-2-6-6V30z" fill="#4fa3f7" stroke="#1f5ea8" stroke-width="3"/><rect x="28" y="14" width="22" height="14" rx="5" fill="none" stroke="#1f5ea8" stroke-width="5"/><path d="M28 48h40v26H28z" fill="#8cc6ff" stroke="#1f5ea8" stroke-width="2"/><path d="M60 12h16" stroke="#1f5ea8" stroke-width="3"/></svg>',
  drum:'<svg viewBox="0 0 100 100"><rect x="20" y="12" width="60" height="80" rx="6" fill="#9aa4b0" stroke="#5b6470" stroke-width="3"/><ellipse cx="50" cy="13" rx="30" ry="7" fill="#c5ccd4" stroke="#5b6470" stroke-width="3"/><path d="M20 38h60M20 66h60" stroke="#5b6470" stroke-width="4"/><path d="M32 46c8 4 14-2 22 4s14 2 16 6" stroke="#c46b2a" stroke-width="4" fill="none" opacity=".7"/><circle cx="62" cy="13" r="4" fill="#5b6470"/></svg>',
  bigbox:'<svg viewBox="0 0 100 100"><path d="M8 34l42-14 42 14v46L50 96 8 80z" fill="#b98448" stroke="#6e4317" stroke-width="3"/><path d="M8 34l42 14 42-14M50 48v48" stroke="#6e4317" stroke-width="3" fill="none"/><path d="M20 60c6 6 10 0 16 6M60 70c6-4 12 2 18-4" stroke="#6e4317" stroke-width="3" fill="none" opacity=".6"/><path d="M60 26l10 4" stroke="#8a5a28" stroke-width="10" opacity=".5"/></svg>',
  mound:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="80" rx="46" ry="12" fill="#d9b06a"/><path d="M6 80c6-26 22-44 44-44s38 18 44 44z" fill="#e7c27d"/><path d="M22 66c6-10 14-16 24-18" stroke="#f6e0ac" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="64" cy="62" r="3" fill="#c79a52"/><circle cx="36" cy="72" r="3" fill="#c79a52"/><circle cx="56" cy="74" r="2.5" fill="#c79a52"/></svg>',
  spark:'<svg viewBox="0 0 24 24"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#fff8b0" stroke="#f2c230" stroke-width="1.2"/></svg>'

let AC = null;
function tone(f, d=.12, type='sine', v=.15, delay=0){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  }catch(e){}
}

  bad(){ tone(220,.18,'square',.07); },
  reveal(){ tone(990,.08,'sine',.1); tone(1320,.12,'sine',.1,.06); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,i*.13)); }
};

function buildWorld(L){

  // 배경

  const list = [];
  L.light.forEach(t=>list.push({type:t, kind:'light'}));
  L.heavy.forEach(t=>list.push({type:t, kind:'heavy'}));
  L.hidden.forEach(t=>list.push({type:t, kind:'mound'}));
  L.float.forEach(t=>list.push({type:t, kind:'float'}));
  shuffle(list);
  // 첫 화면에 몇 개는 꼭 보이게: 가로를 균등 구간으로 나눠 배치
  const land = list.filter(o=>o.kind!=='float'), sea2 = list.filter(o=>o.kind==='float');
  placeSpread(land, W, 55, 86, true);
  placeSpread(sea2, W, 31, 42, false);
  let id=0;
  list.forEach(o=>{ o.id = id++; o.done=false; makeItem(o); S.items.push(o); });
  S.total = list.length;
}
function placeSpread(arr, W, yMin, yMax){
  const n = arr.length; if(!n) return;
  const margin = 0.05/W; // 화면 가장자리 여백(비율)
  arr.forEach((o,i)=>{
    const a = margin + (1-2*margin)*i/n, b = margin + (1-2*margin)*(i+1)/n;
    o.x = rand(a + (b-a)*.15, b - (b-a)*.15);
    o.y = (i%2===0) ? rand(yMin, (yMin+yMax)/2) : rand((yMin+yMax)/2, yMax);
  });
}

/* ---------- 꾹 누르기 ---------- */
const HOLD_MS = 1300;
function bindHold(o){
  const el = o.el; let t0=0, raf=0, on=false;
  const stop = (fromUp)=>{
    if(!on) return; on=false; cancelAnimationFrame(raf);
    el.classList.remove('holding');
    const p = parseFloat(el.style.getPropertyValue('--p')||0);
    el.style.setProperty('--p',0);
    if(!o.done && fromUp){
      el.classList.remove('nope'); void el.offsetWidth; el.classList.add('nope');
      toast(p<.25 ? '무거워요! 꾹~ 누르고 있어요' : '조금만 더! 끝까지 꾹~');
    }
  };
  el.addEventListener('pointerdown', e=>{
    if(o.done) return;
    e.preventDefault();
    if(S.bag.length>=BAG_CAP){ bagFull(); return; }
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    on=true; t0=performance.now(); el.classList.add('holding');
    const loop = now=>{
      if(!on) return;
      const p = Math.min(1,(now-t0)/HOLD_MS);
      el.style.setProperty('--p',p);
      if(p>=1){ on=false; el.classList.remove('holding'); pick(o); return; }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  });
  el.addEventListener('pointerup', ()=>stop(true));
  el.addEventListener('pointercancel', ()=>stop(false));
  el.addEventListener('lostpointercapture', ()=>stop(true));
}

/* ---------- 올려 두기(호버) ---------- */
const HOVER_MS = 1100;
function bindHover(o){
  const el = o.el; let p=0, over=false, last=0, raf=0, clicked=false;
  const loop = now=>{
    const dt = now-last; last=now;
    p = over ? Math.min(1, p + dt/HOVER_MS) : Math.max(0, p - dt/(HOVER_MS*1.5));
    el.style.setProperty('--p',p);
    if(p>=1){ reveal(o); return; }
    if(over || p>0) raf = requestAnimationFrame(loop);
    else el.classList.remove('hovering');
  };
  el.addEventListener('pointerenter', ()=>{
    if(o.kind!=='mound') return;
    over=true; el.classList.add('hovering'); last=performance.now();
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  });
  el.addEventListener('pointerleave', ()=>{ over=false; });
  el.addEventListener('pointerdown', e=>{
    if(o.kind!=='mound') return;
    e.preventDefault();
    if(!clicked){ clicked=true; toast('누르지 말고 가만히 올려만 두세요'); }
  });
}
function reveal(o){
  o.kind = 'light';
  const el = o.el;
  el.className = 'it light pop';
  const s = sizeOf(o);
  el.style.width = el.style.height = s+'px';
  el.innerHTML = `<div class="art">${ART[o.type]}</div>`;
  el.addEventListener('click', ()=>pick(o));
  sfx.reveal();
}

/* ---------- 줍기 ---------- */
function pick(o){
  if(o.done || o.kind==='mound') return;
  if(S.bag.length>=BAG_CAP){ bagFull(); return; }
  o.done = true;
  sfx.pick();
  // 가방으로 날아가기
  const r = o.el.getBoundingClientRect();
  const slotIdx = S.bag.length;
  S.bag.push(o);
  renderBag();
  const target = document.querySelectorAll('#bag .slot')[slotIdx];
  if(target){ target.style.visibility='hidden'; }
  const f = document.createElement('div');
  f.className = 'fly';
  f.innerHTML = ART[o.type];
  Object.assign(f.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  document.body.appendChild(f);
  o.el.remove();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(target){ const t=target.getBoundingClientRect(); Object.assign(f.style,{left:(t.left+8)+'px',top:(t.top+8)+'px',width:(t.width-16)+'px',height:(t.height-16)+'px'}); }
    else { f.style.opacity=0; }
  }));
  setTimeout(()=>{ f.remove(); if(target) target.style.visibility=''; }, 580);
  updateHud();
}
function bagFull(){
  const b = $('#bagBox'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  toast('가방이 꽉 찼어요! 먼저 분리수거해요');
  sfx.bad();
}

/* ---------- 가방 & 분리수거 ---------- */
function renderBag(){
  const bag = $('#bag'); bag.innerHTML='';
  for(let i=0;i<BAG_CAP;i++){
    const s = document.createElement('div');
    const o = S.bag[i];
    s.className = 'slot' + (o?' has':'');
    if(o){ s.innerHTML = `<div class="art">${ART[o.type]}</div>`; bindDrag(s,o); }
    bag.appendChild(s);
  }
  $('#bagCnt').textContent = `(${S.bag.length}/${BAG_CAP})`;
  $('#bagBox').classList.toggle('full', S.bag.length>=BAG_CAP);
}
function buildBins(L){
  const box = $('#bins'); box.innerHTML='';
  L.cats.forEach(c=>{
    const b = document.createElement('div');
    b.className='bin'; b.dataset.cat=c;
    const icon = {plastic:ART.bottle, can:ART.can, paper:ART.box}[c];
    b.innerHTML = `<div class="bsvg" style="position:relative">${binSvgOnly(c)}<div style="position:absolute;left:30%;top:36%;width:40%;height:40%">${icon}</div></div><div class="bl" style="background:${CATS[c].color}">${CATS[c].name}</div>`;
    box.appendChild(b);
  });
}
function binSvgOnly(cat){
  const c = CATS[cat].color;
  return `<svg viewBox="0 0 100 100"><rect x="12" y="8" width="76" height="14" rx="6" fill="${c}" stroke="#2c3a48" stroke-width="3"/><rect x="40" y="2" width="20" height="8" rx="3" fill="${c}" stroke="#2c3a48" stroke-width="3"/><path d="M18 22h64l-6 72H24z" fill="${c}" stroke="#2c3a48" stroke-width="3"/><circle cx="50" cy="56" r="22" fill="#fff"/></svg>`;
}
function binAt(x,y){
  for(const b of document.querySelectorAll('.bin')){
    const r = b.getBoundingClientRect();
    if(x>=r.left-10 && x<=r.right+10 && y>=r.top-14 && y<=r.bottom+10) return b;
  }
  return null;
}
function bindDrag(slot,o){
  slot.addEventListener('dragstart', e=>e.preventDefault());
  slot.addEventListener('pointerdown', e=>{
    e.preventDefault();
    try{ slot.setPointerCapture(e.pointerId); }catch(_){}
    const g = document.createElement('div'); g.id='ghost'; g.innerHTML = ART[o.type];
    g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px';
    document.body.appendChild(g);
    slot.classList.add('lift');
    let over=null;
    const move = ev=>{
      g.style.left=ev.clientX+'px'; g.style.top=ev.clientY+'px';
      const b = binAt(ev.clientX, ev.clientY);
      if(b!==over){ over&&over.classList.remove('over'); over=b; b&&b.classList.add('over'); }
    };
    const up = ev=>{
      slot.removeEventListener('pointermove',move);
      slot.removeEventListener('pointerup',up);
      slot.removeEventListener('pointercancel',up);
      over&&over.classList.remove('over');
      g.remove(); slot.classList.remove('lift');
      const b = ev.type==='pointerup' ? binAt(ev.clientX, ev.clientY) : null;
      if(b) drop(o,b);
    };
    slot.addEventListener('pointermove',move);
    slot.addEventListener('pointerup',up);
    slot.addEventListener('pointercancel',up);
  });
}
function drop(o,b){
  const cat = TYPES[o.type].cat;
  if(b.dataset.cat===cat){
    S.bag = S.bag.filter(x=>x!==o);
    S.sorted++;
    document.querySelectorAll('.bin').forEach(x=>x.classList.remove('hint'));
    b.classList.remove('eat'); void b.offsetWidth; b.classList.add('eat');
    sfx.good();
    renderBag(); updateHud();
    if(S.sorted>=S.total) setTimeout(win, 450);
  }else{
    S.wrong[o.id] = (S.wrong[o.id]||0)+1;
    b.classList.remove('no'); void b.offsetWidth; b.classList.add('no');
    sfx.bad();
    if(S.wrong[o.id]>=2){
      toast(`${TYPES[o.type].name}은(는) 반짝이는 통에 넣어요`);
      document.querySelector(`.bin[data-cat="${cat}"]`).classList.add('hint');
    }else toast('앗! 다른 통일까요? 다시 생각해 봐요');
  }
}

/* ---------- 화면 정보 ---------- */
function updateHud(){
  const left = S.items.filter(o=>!o.done).length;
  $('#countTxt').textContent = left ? `해변에 남은 쓰레기 ${left}개` : (S.bag.length ? '남은 쓰레기를 분리수거해요' : '깨끗해요!');
  const ratio = S.sorted / S.total;
  $('#barFill').style.width = (ratio*100)+'%';
  $('#goalAni').classList.toggle('near', ratio>=.999);
  const d = document.getElementById('dirt'); if(d) d.style.opacity = (1-ratio)*.6;
  updateEdges();
}
function updateEdges(){
  if(!S) return;
  const W = world.clientWidth, vl = beach.scrollLeft, vr = vl + beach.clientWidth;
  let l=0, r=0;
  S.items.forEach(o=>{ if(o.done) return; const px=o.x*W; if(px<vl+20) l++; else if(px>vr-20) r++; });
  const eL=$('#edgeL'), eR=$('#edgeR');
  eL.classList.toggle('hidden', !l); eR.classList.toggle('hidden', !r);
  eL.querySelector('span').textContent = `${l}개`; eR.querySelector('span').textContent = `${r}개`;
}
beach.addEventListener('wheel', e=>{
  e.preventDefault();
  const d = Math.abs(e.deltaY)>Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  beach.scrollLeft += d * (e.deltaMode===1 ? 30 : 1.2);
},{passive:false});
beach.addEventListener('scroll', ()=>{
  updateEdges();
  if(S && !S.scrolled && beach.scrollLeft>40){ S.scrolled=true; $('#wheelHint').classList.add('hidden'); }
});
window.addEventListener('resize', ()=>{ if(S) updateEdges(); });

let toastT=0;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ===================== 안내 & 완료 ===================== */
function openOv(html){ $('#ovCard').innerHTML = html; $('#ov').classList.remove('hidden'); }
function closeOv(){ $('#ov').classList.add('hidden'); }
function showIntro(n){
  const L = LEVELS[n];
  const rows = L.moves.map(m=>{
    const icon = m==='float' ? 'click' : m;
    const isNew = L.newMoves.includes(m) && n>0;
    return `<div class="mvrow${isNew?' new':''}"><div class="ms">${mouseSvg(icon)}</div>${MOVE_TXT[m]}${isNew?'<span class="nw">NEW</span>':''}</div>`;
  }).join('');
  openOv(`<h2>${n+1}단계 · ${L.name}</h2><p class="sub">${L.sub}</p><div class="moves">${rows}</div><button class="btn main" id="goBtn">시작!</button>`);
  $('#goBtn').onclick = ()=>{
    closeOv(); tone(0.0001,.01); startTimer();
    if(n===0 || LEVELS[n].width>1){ $('#wheelMs').innerHTML = mouseSvg('wheel'); $('#wheelHint').classList.toggle('hidden', n>1); }
    updateEdges();
  };
}
function win(){
  sfx.win();
  stopTimer();
  S.end = performance.now();
  const ms = S.end - S.t0;
  $('#timer').textContent='⏱ '+fmt(ms);
  const recHtml = `<div class="bigtime">⏱ ${fmt(ms)}</div>`;
  done.add(S.lv);
  // 바다 친구 등장
  const sw = document.createElement('div'); sw.className='swimmer'; sw.innerHTML = ANI[S.L.ani];
  sw.style.left = (beach.scrollLeft + beach.clientWidth/2 - 100)+'px';
  sw.style.top = 'calc(26% - 20px)';
  world.appendChild(sw);
  const L = S.L, n = S.lv;
  setTimeout(()=>{
    if(n < LEVELS.length-1){
      openOv(`<div class="bigani">${ANI[L.ani]}</div><h2>바다가 깨끗해졌어요!</h2>${recHtml}<p class="sub">${L.aniName}${/[가-힣]$/.test(L.aniName)&&((L.aniName.charCodeAt(L.aniName.length-1)-0xac00)%28)?'이':'가'} 돌아왔어요</p><div class="row"><button class="btn" id="againBtn">다시 하기</button><button class="btn main" id="nextBtn">다음 단계 ▶</button></div>`);
      $('#nextBtn').onclick = ()=>startLevel(n+1);
    }else{
      const fr = LEVELS.map(x=>`<div>${ANI[x.ani]}</div>`).join('');
      openOv(`<h2>제주 바다를 지켰어요!</h2>${recHtml}<p class="sub">바다 친구들이 모두 돌아왔어요. 고마워요!</p><div class="friends">${fr}</div><div class="row"><button class="btn" id="againBtn">다시 하기</button><button class="btn main" id="homeBtn2">처음으로</button></div>`);
      $('#homeBtn2').onclick = goHome;
    }
    $('#againBtn').onclick = ()=>startLevel(n);
  }, 2000);
}

document.addEventListener('contextmenu', e=>{ if(!$('#game').classList.contains('hidden')) e.preventDefault(); });
renderHome();
</script>
